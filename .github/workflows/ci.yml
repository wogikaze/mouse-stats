name: Verify MVP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npx playwright install msedge
      - run: npx playwright test --config apps/cloud/playwright.config.ts
      - run: npm run test:ui
      - run: npm run tauri -w @mouse-stats/desktop -- build
      - run: npm run test:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-stats-windows
          path: |
            target/release/bundle/nsis/*.exe
            test-results/native-smoke.json
            test-results/native-resources-smoke.json
          if-no-files-found: warn
